name: motophd

# Глобальная политика логов: без неё json-file растёт до заполнения диска.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    image: ${GHCR_IMAGE:-ghcr.io/maevskyy/motophd}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      DATABASE_URI: ${DATABASE_URI:?DATABASE_URI is required}
      NODE_ENV: production
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?PAYLOAD_SECRET is required}
      PORT: 3000
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3000/api/health'').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"'
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Разовые операции (миграции, seed). Отдельный образ, потому что им нужен payload CLI
  # и полный node_modules — в основной образ это не тащим, он от этого раздувался вчетверо.
  # Профиль ops → на `up -d` не поднимается, запускается только явным `run`.
  migrate:
    image: ${GHCR_IMAGE:-ghcr.io/maevskyy/motophd}:${IMAGE_TAG:-latest}-ops
    profiles:
      - ops
    logging: *default-logging
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      DATABASE_URI: ${DATABASE_URI:?DATABASE_URI is required}
      NODE_ENV: production
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?PAYLOAD_SECRET is required}
    depends_on:
      postgres:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.6.16
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    entrypoint:
      - /bin/sh
      - -c
      - 'test -n "$$GF_SECURITY_ADMIN_PASSWORD" || { echo "grafana: GRAFANA_ADMIN_PASSWORD is empty — set it in ~/motophd/.env (MOT-4)"; exit 1; }; exec /run.sh'
    # env_file здесь НЕ используем: Grafana доступна из интернета, а прод-.env
    # содержит PAYLOAD_SECRET, POSTGRES_PASSWORD, DATABASE_URI и ключи R2/Resend.
    # Пробрасываем ровно две переменные, нужные контакт-поинту Telegram.
    environment:
      GF_SERVER_ROOT_URL: https://grafana.motophd.com
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      # Пустой пароль означал бы дефолтный admin/admin наружу, поэтому без
      # GRAFANA_ADMIN_PASSWORD контейнер не стартует (см. entrypoint).
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      TG_BOT_TOKEN: ${TG_BOT_TOKEN:-}
      TG_CHAT_ID: ${TG_CHAT_ID:-}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

  prometheus:
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 768m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  loki:
    image: grafana/loki:3.4.2
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./monitoring/loki.yml:/etc/loki/config.yml:ro
      - loki_data:/loki

  promtail:
    image: grafana/promtail:3.4.2
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./monitoring/promtail.yml:/etc/promtail/config.yml:ro
      - promtail_positions:/tmp
      # Docker service discovery: только так в Loki попадает имя контейнера.
      # Сокет — read-only; логи читаются через Docker API.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 128m
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /:/host:ro,rslave

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 384m
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.26.0
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 128m
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml:ro

  backup:
    build:
      context: ./backup
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    # BACKUP_*-переменные с пустым дефолтом: compose интерполирует ВЕСЬ файл
    # на любой команде, и «:?» ронял деплой приложения, пока бэкапы (MOT-5)
    # не заведены. Строгую проверку делает сам backup.sh при запуске.
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB is required}
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER is required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      BACKUP_R2_ENDPOINT: ${BACKUP_R2_ENDPOINT:-}
      BACKUP_R2_ACCESS_KEY_ID: ${BACKUP_R2_ACCESS_KEY_ID:-}
      BACKUP_R2_SECRET_ACCESS_KEY: ${BACKUP_R2_SECRET_ACCESS_KEY:-}
      BACKUP_R2_BUCKET: ${BACKUP_R2_BUCKET:-motophd-backups}
      HEALTHCHECKS_BACKUP_URL: ${HEALTHCHECKS_BACKUP_URL:-}
      TZ: ${TZ:-UTC}
    volumes:
      - backup_data:/backups
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - grafana

volumes:
  postgres_data:
  grafana_data:
  prometheus_data:
  loki_data:
  promtail_positions:
  backup_data:
  caddy_data:
  caddy_config:
