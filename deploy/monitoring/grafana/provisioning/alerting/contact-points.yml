apiVersion: 1

contactPoints:
  - orgId: 1
    name: Telegram
    receivers:
      - uid: motophd-telegram
        type: telegram
        settings:
          bottoken: ${TG_BOT_TOKEN}
          chatid: ${TG_CHAT_ID}
          message: '{{ template "default.message" . }}'

policies:
  - orgId: 1
    receiver: Telegram
    group_by: [alertname]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
