name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/motophd

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, Typecheck, Unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and component tests
        run: pnpm test

  # Образ собирается на КАЖДЫЙ пуш в main и dev — заранее, в фоне.
  # Кнопка Deploy потом просто берёт готовый тег, ничего не собирая.
  build:
    name: Build and Push Image
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          provenance: false
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Build and push ops image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ops
          push: true
          provenance: false
          cache-from: |
            type=gha,scope=app
            type=gha,scope=ops
          cache-to: type=gha,mode=max,scope=ops
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-ops
            ${{ env.IMAGE_NAME }}:latest-ops

  e2e:
    name: E2E
    needs: build
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') }}
    runs-on: ubuntu-latest
    env:
      DATABASE_URI: postgres://motophd:motophd@127.0.0.1:5432/motophd
      E2E_BASE_URL: http://127.0.0.1:3100
      PAYLOAD_SECRET: ci-only-payload-secret
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: motophd
          POSTGRES_USER: motophd
          POSTGRES_PASSWORD: motophd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U motophd -d motophd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'

      - name: Install Playwright system deps
        run: npx playwright install-deps chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'

      # Миграции и seed — из исходников (зависимости уже стоят ради Playwright).
      # Тянуть ради этого полуторагигабайтный ops-образ — расточительство.
      - name: Apply migrations
        run: pnpm payload migrate

      - name: Seed content
        run: pnpm seed

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start app container
        run: |
          docker run -d --name motophd-e2e --network host \
            -e DATABASE_URI="$DATABASE_URI" \
            -e PAYLOAD_SECRET="$PAYLOAD_SECRET" \
            -e PORT=3100 \
            "$IMAGE_NAME:sha-${{ github.sha }}"
          curl -fsS --retry 30 --retry-delay 2 --retry-all-errors "$E2E_BASE_URL/api/health"

      - name: Run e2e smoke tests
        run: pnpm test:e2e

      - name: App logs on failure
        if: failure()
        run: docker logs motophd-e2e

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
