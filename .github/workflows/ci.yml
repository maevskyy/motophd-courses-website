name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Lint, Typecheck, Build
    runs-on: ubuntu-latest
    env:
      DATABASE_URI: postgres://motophd:motophd@localhost:5432/motophd
      PAYLOAD_SECRET: ci-only-payload-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and component tests
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    env:
      DATABASE_URI: postgres://motophd:motophd@localhost:5432/motophd
      PAYLOAD_SECRET: ci-only-payload-secret
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: motophd
          POSTGRES_USER: motophd
          POSTGRES_PASSWORD: motophd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U motophd -d motophd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Apply migrations
        run: pnpm payload migrate

      - name: Seed content
        run: pnpm seed

      - name: Build
        run: pnpm build

      - name: Run e2e smoke tests
        run: pnpm test:e2e

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
