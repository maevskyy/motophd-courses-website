name: Deploy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GHCR image tag to deploy. Leave empty to build the current commit.
        required: false
        type: string
      seed:
        description: Seed initial content after migrations.
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/motophd

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  resolve-tag:
    name: Resolve Image Tag
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - name: Resolve tag
        id: tag
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$REQUESTED_TAG" ]; then
            case "$REQUESTED_TAG" in
              *[!A-Za-z0-9._-]*)
                echo "::error::Invalid image tag: use only letters, digits, dots, underscores, and hyphens"
                exit 1
                ;;
            esac
            echo "image_tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

  preflight:
    name: Preflight VPS
    runs-on: ubuntu-latest
    steps:
      - name: Verify required secrets
        env:
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          test -n "$VPS_HOST" || { echo "::error::VPS_HOST is missing"; exit 1; }
          test -n "$VPS_USER" || { echo "::error::VPS_USER is missing"; exit 1; }
          test -n "$VPS_SSH_KEY" || { echo "::error::VPS_SSH_KEY is missing"; exit 1; }
          test -n "$GHCR_READ_TOKEN" || { echo "::error::GHCR_READ_TOKEN is missing"; exit 1; }

      - name: Verify VPS prerequisites
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu
            command -v docker >/dev/null || { echo "Docker is not installed"; exit 1; }
            docker info >/dev/null || { echo "Docker daemon is unavailable for the deploy user"; exit 1; }
            docker compose version
            test -s ~/motophd/docker-compose.prod.yml || { echo "~/motophd/docker-compose.prod.yml is missing"; exit 1; }
            test -s ~/motophd/.env || { echo "~/motophd/.env is missing"; exit 1; }
            cd ~/motophd
            docker compose -f docker-compose.prod.yml config --quiet
            docker compose -f docker-compose.prod.yml config --format json | python3 -c '
            import json
            import sys
            from urllib.parse import unquote, urlsplit

            config = json.load(sys.stdin)
            app_env = config["services"]["app"]["environment"]
            postgres_env = config["services"]["postgres"]["environment"]
            uri = urlsplit(app_env["DATABASE_URI"])
            checks = (
                uri.scheme in ("postgres", "postgresql"),
                uri.username == postgres_env["POSTGRES_USER"],
                unquote(uri.password or "") == postgres_env["POSTGRES_PASSWORD"],
                uri.hostname == "postgres",
                uri.path == "/" + postgres_env["POSTGRES_DB"],
                uri.port == 5432,
            )
            if not all(checks):
                raise SystemExit("DATABASE_URI does not match the Postgres service configuration")
            '
            available_kb=$(df -Pk ~/motophd | awk 'NR == 2 { print $4 }')
            test "$available_kb" -ge 5242880 || { echo "Less than 5 GiB is available on the VPS"; exit 1; }
            echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

  tests:
    name: Unit + E2E Gate
    runs-on: ubuntu-latest
    env:
      DATABASE_URI: postgres://motophd:motophd@localhost:5432/motophd
      PAYLOAD_SECRET: ci-only-payload-secret
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: motophd
          POSTGRES_USER: motophd
          POSTGRES_PASSWORD: motophd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U motophd -d motophd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit and component tests
        run: pnpm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Apply migrations
        run: pnpm payload migrate

      - name: Seed content
        run: pnpm seed

      - name: Build
        run: pnpm build

      - name: Run e2e smoke tests
        run: pnpm test:e2e

  build:
    name: Build and Push Image
    needs:
      - resolve-tag
      - preflight
      - tests
    if: ${{ inputs.tag == '' && needs.tests.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.resolve-tag.outputs.image_tag }}
            ${{ env.IMAGE_NAME }}:latest

  deploy:
    name: Deploy to VPS
    needs:
      - resolve-tag
      - preflight
      - tests
      - build
    if: ${{ always() && needs.resolve-tag.result == 'success' && needs.preflight.result == 'success' && needs.tests.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy image over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu
            cd ~/motophd
            echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
            IMAGE_TAG="${{ needs.resolve-tag.outputs.image_tag }}" docker compose -f docker-compose.prod.yml pull app
            IMAGE_TAG="${{ needs.resolve-tag.outputs.image_tag }}" docker compose -f docker-compose.prod.yml up -d postgres
            IMAGE_TAG="${{ needs.resolve-tag.outputs.image_tag }}" docker compose -f docker-compose.prod.yml run --rm app pnpm payload migrate
            if [ "${{ inputs.seed }}" = "true" ]; then
              IMAGE_TAG="${{ needs.resolve-tag.outputs.image_tag }}" docker compose -f docker-compose.prod.yml run --rm app pnpm seed
            fi
            IMAGE_TAG="${{ needs.resolve-tag.outputs.image_tag }}" docker compose -f docker-compose.prod.yml up -d --remove-orphans
            curl -fsS --retry 30 --retry-delay 3 --retry-all-errors http://127.0.0.1:3000/api/health

      - name: Production smoke check
        run: |
          curl -fsS --retry 5 --retry-delay 3 https://motophd.com/api/health
          homepage=$(curl -fsS --retry 5 --retry-delay 3 https://motophd.com/en)
          echo "$homepage" | grep -q "/en/courses/" || { echo "::error::Homepage is up but course cards are missing"; exit 1; }
          curl -fsS -o /dev/null https://motophd.com/admin
