name: Deploy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GHCR image tag to deploy. Leave empty to build the current commit.
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/motophd

jobs:
  resolve-tag:
    name: Resolve Image Tag
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "image_tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build and Push Image
    needs: resolve-tag
    if: ${{ inputs.tag == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.resolve-tag.outputs.image_tag }}
            ${{ env.IMAGE_NAME }}:latest

  deploy:
    name: Deploy to VPS
    needs:
      - resolve-tag
      - build
    if: ${{ always() && needs.resolve-tag.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy image over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu
            cd ~/motophd
            echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
            IMAGE_TAG="${{ needs.resolve-tag.outputs.image_tag }}" docker compose -f docker-compose.prod.yml pull app
            IMAGE_TAG="${{ needs.resolve-tag.outputs.image_tag }}" docker compose -f docker-compose.prod.yml up -d --remove-orphans
            curl -fsS --retry 20 --retry-delay 3 http://127.0.0.1/api/health
