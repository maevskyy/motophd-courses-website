name: Deploy

# Деплой НИЧЕГО не собирает и не тестирует: образ и проверки уже сделаны CI на пуше.
# Здесь только: дождаться зелёного CI этого коммита → pull → миграции → up → смоук.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GHCR image tag to deploy (e.g. sha-<full-sha>). Leave empty to deploy the current commit.
        required: false
        type: string
      seed:
        description: Seed initial content after migrations.
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: read
  actions: read
  checks: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/motophd

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  resolve-tag:
    name: Resolve Image Tag
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - name: Resolve tag
        id: tag
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$REQUESTED_TAG" ]; then
            case "$REQUESTED_TAG" in
              *[!A-Za-z0-9._-]*)
                echo "::error::Invalid image tag: use only letters, digits, dots, underscores, and hyphens"
                exit 1
                ;;
            esac
            echo "image_tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
            echo "sha=${REQUESTED_TAG#sha-}" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

  # Ждём, пока CI пуша (сборка + e2e) станет зелёным. Если он уже прошёл —
  # это один API-запрос на несколько секунд. Красный CI = деплой не начнётся.
  await-ci:
    name: Await Green CI
    needs: resolve-tag
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SHA: ${{ needs.resolve-tag.outputs.sha }}
    steps:
      - name: Wait for CI of this commit
        run: |
          for i in $(seq 1 60); do
            run=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=1" \
              --jq '.workflow_runs[0] | if . == null then "none none" else "\(.status) \(.conclusion)" end')
            status=${run% *}; conclusion=${run#* }
            echo "CI: status=$status conclusion=$conclusion (attempt $i)"
            if [ "$status" = "completed" ]; then
              [ "$conclusion" = "success" ] && exit 0
              echo "::error::CI for $SHA finished with '$conclusion' — fix it before deploying"
              exit 1
            fi
            if [ "$status" = "none" ] && [ "$i" -ge 6 ]; then
              echo "::error::No CI run found for $SHA — push the commit first"
              exit 1
            fi
            sleep 10
          done
          echo "::error::Timed out waiting for CI of $SHA"
          exit 1

  preflight:
    name: Preflight VPS
    runs-on: ubuntu-latest
    steps:
      - name: Verify required secrets
        env:
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          test -n "$VPS_HOST" || { echo "::error::VPS_HOST is missing"; exit 1; }
          test -n "$VPS_USER" || { echo "::error::VPS_USER is missing"; exit 1; }
          test -n "$VPS_SSH_KEY" || { echo "::error::VPS_SSH_KEY is missing"; exit 1; }
          test -n "$GHCR_READ_TOKEN" || { echo "::error::GHCR_READ_TOKEN is missing"; exit 1; }

      - name: Verify VPS prerequisites
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu
            command -v docker >/dev/null || { echo "Docker is not installed"; exit 1; }
            docker info >/dev/null || { echo "Docker daemon is unavailable for the deploy user"; exit 1; }
            test -s ~/motophd/docker-compose.prod.yml || { echo "~/motophd/docker-compose.prod.yml is missing"; exit 1; }
            test -s ~/motophd/.env || { echo "~/motophd/.env is missing"; exit 1; }
            cd ~/motophd
            docker compose -f docker-compose.prod.yml config --quiet
            available_kb=$(df -Pk ~/motophd | awk 'NR == 2 { print $4 }')
            test "$available_kb" -ge 5242880 || { echo "Less than 5 GiB is available on the VPS"; exit 1; }
            echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

  deploy:
    name: Deploy to VPS
    needs:
      - resolve-tag
      - await-ci
      - preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Конфиги (compose, Caddyfile, monitoring, backup) едут на бокс каждым
      # деплоем: правка в репо не требует ручного scp. .env не трогается —
      # он не лежит в deploy/.
      - name: Sync deploy configs to VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: deploy
          target: /home/${{ secrets.VPS_USER }}/motophd
          strip_components: 1
          overwrite: true

      - name: Deploy image over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu
            cd ~/motophd
            export IMAGE_TAG="${{ needs.resolve-tag.outputs.image_tag }}"
            echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
            docker compose -f docker-compose.prod.yml pull app
            docker compose -f docker-compose.prod.yml --profile ops pull migrate
            docker compose -f docker-compose.prod.yml up -d postgres
            docker compose -f docker-compose.prod.yml --profile ops run --rm migrate
            if [ "${{ inputs.seed }}" = "true" ]; then
              docker compose -f docker-compose.prod.yml --profile ops run --rm migrate pnpm seed
            fi
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker compose -f docker-compose.prod.yml exec -T caddy caddy reload --config /etc/caddy/Caddyfile || docker compose -f docker-compose.prod.yml restart caddy
            curl -fsS --retry 30 --retry-delay 3 --retry-all-errors http://127.0.0.1:3000/api/health

      - name: Production smoke check
        run: |
          curl -fsS --retry 5 --retry-delay 3 https://motophd.com/api/health
          homepage=$(curl -fsS --retry 5 --retry-delay 3 https://motophd.com/en)
          echo "$homepage" | grep -q "/en/courses/" || { echo "::error::Homepage is up but course cards are missing"; exit 1; }
          admin_status=$(curl -s -o /dev/null -w '%{http_code}' https://motophd.com/admin)
          [ "$admin_status" = "404" ] || { echo "::error::Admin must be hidden on the public host, got $admin_status"; exit 1; }
